<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>アバタートーククエスト</title>
  <style>
    :root {
      --bg: #0f1221;
      --panel: #1a1f37;
      --panel2: #232947;
      --accent: #88e3ff;
      --accent2: #ff9ad5;
      --text: #f3f5ff;
      --muted: #bcc3e6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: radial-gradient(circle at top, #1b2140, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .game { width: min(100%, 980px); background: linear-gradient(160deg, var(--panel), var(--panel2)); border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,.35); overflow: hidden; border: 1px solid rgba(255,255,255,.1);}
    header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: rgba(0,0,0,.2); border-bottom: 1px solid rgba(255,255,255,.08);}
    h1 { margin: 0; font-size: 1.1rem; letter-spacing: .05em; }
    .status { display: flex; gap: 12px; color: var(--muted); font-size: .95rem; }
    main { display: grid; grid-template-columns: 320px 1fr; }
    .left { padding: 18px; border-right: 1px solid rgba(255,255,255,.08); }
    .section-title { margin: 0 0 10px; font-size: .95rem; color: var(--muted); }
    .avatar-card { background: rgba(0,0,0,.18); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 16px; margin-bottom: 14px; }

    .avatar-stage { width: 180px; height: 190px; margin: 0 auto 14px; position: relative; }
    .face {
      position: absolute; inset: 20px 20px 6px;
      transition: transform .2s ease;
    }
    .face.talk { transform: translateY(2px) scale(1.02); }
    .head {
      position: absolute; inset: 0;
      border: 4px solid rgba(0,0,0,.22);
      background: #ffd6b6;
      z-index: 3;
    }
    .face.outline-round .head { border-radius: 45% 45% 48% 48%; }
    .face.outline-oval .head { border-radius: 42% 42% 52% 52%; }
    .face.outline-square .head { border-radius: 30% 30% 36% 36%; }

    .ear { position: absolute; top: 90px; width: 18px; height: 28px; background: #ffd6b6; border: 3px solid rgba(0,0,0,.18); z-index: 2; }
    .ear.left { left: 2px; border-right: none; border-radius: 12px 0 0 12px; }
    .ear.right { right: 2px; border-left: none; border-radius: 0 12px 12px 0; }

    .hair { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 4; background: #3a2a20; }
    .hair.style-short { height: 50px; border-radius: 40px 40px 28px 28px; }
    .hair.style-bob { height: 64px; border-radius: 42px 42px 18px 18px; }
    .hair.style-spiky { height: 60px; clip-path: polygon(0% 88%, 8% 35%, 16% 82%, 25% 18%, 35% 80%, 46% 10%, 56% 80%, 66% 22%, 76% 84%, 86% 34%, 100% 88%, 100% 0%, 0% 0%); }

    .brow { position: absolute; top: 64px; width: 30px; height: 6px; background: rgba(60,38,24,.9); border-radius: 999px; z-index: 5; }
    .brow.left { left: 39px; transform: rotate(-7deg); }
    .brow.right { right: 39px; transform: rotate(7deg); }

    .eye { position: absolute; top: 78px; z-index: 5; background-position: center; background-size: contain; background-repeat: no-repeat; }
    .eye.left { left: 41px; }
    .eye.right { right: 41px; }
    .eye.style-round { width: 24px; height: 24px; }
    .eye.style-almond { width: 28px; height: 18px; }
    .eye.style-line { width: 26px; height: 7px; }

    .nose { position: absolute; left: 50%; top: 104px; transform: translateX(-50%); z-index: 5; background-position: center; background-size: contain; background-repeat: no-repeat; }
    .nose.style-dot { width: 10px; height: 8px; }
    .nose.style-line { width: 4px; height: 18px; }
    .nose.style-triangle { width: 14px; height: 12px; }

    .mouth { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 5; transition: all .15s ease; background-position: center; background-size: contain; background-repeat: no-repeat; }
    .mouth.style-smile { width: 36px; height: 16px; }
    .mouth.style-flat { width: 32px; height: 4px; }
    .mouth.style-open { width: 24px; height: 14px; }
    .face.talk .mouth.style-smile, .face.talk .mouth.style-open { height: 20px; width: 30px; }

    .name-label { text-align: center; font-weight: 700; margin-bottom: 10px; font-size: 1.1rem; }
    .controls label { display: block; font-size: .88rem; color: #dbe2ff; margin: 8px 0 4px; font-weight: 600; }
    .controls input, .controls select {
      width: 100%; border: 1px solid rgba(255,255,255,.25); background: rgba(10,14,33,.72); color: #ffffff;
      border-radius: 10px; padding: 9px 10px; font-weight: 600;
    }
    .controls select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #d9e5ff 50%), linear-gradient(135deg, #d9e5ff 50%, transparent 50%);
      background-position: calc(100% - 16px) calc(50% - 2px), calc(100% - 10px) calc(50% - 2px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 30px;
    }
    .controls select option { background: #20284a; color: #fff; }
    .controls input:focus, .controls select:focus { outline: 2px solid #9fd8ff; outline-offset: 1px; }

    main > section.right { display: grid; grid-template-rows: 1fr auto; min-height: 560px; }
    .chat { padding: 18px; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 78%; padding: 10px 12px; border-radius: 12px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
    .msg.player { align-self: flex-end; background: #3d6cff; }
    .msg.avatar { align-self: flex-start; background: rgba(255,255,255,.11); border: 1px solid rgba(255,255,255,.12); }
    .input-area { padding: 14px; border-top: 1px solid rgba(255,255,255,.08); display: grid; grid-template-columns: 1fr auto; gap: 10px; background: rgba(0,0,0,.14); }
    .input-area input { border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: var(--text); padding: 11px 12px; font-size: 1rem; }
    button { border: none; border-radius: 12px; background: linear-gradient(120deg, var(--accent), var(--accent2)); color: #17203d; padding: 10px 14px; font-weight: 800; cursor: pointer; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } .left { border-right: none; border-bottom: 1px solid rgba(255,255,255,.08); } main > section.right { min-height: 420px; } }
  </style>
</head>
<body>
  <div class="game">
    <header>
      <h1>🧭 アバタートーククエスト</h1>
      <div class="status">
        <span>親密度: <strong id="bond">0</strong></span>
        <span>ムード: <strong id="mood">🙂 ふつう</strong></span>
      </div>
    </header>
    <main>
      <section class="left">
        <p class="section-title">人型アバター作成</p>
        <div class="avatar-card">
          <div class="avatar-stage">
            <div class="ear left" id="earL"></div>
            <div class="ear right" id="earR"></div>
            <div class="face outline-round" id="face">
              <div class="head" id="head"></div>
              <div class="hair style-short" id="hair"></div>
              <div class="brow left"></div>
              <div class="brow right"></div>
              <div class="eye left style-round" id="eyeL" aria-label="左目"></div>
              <div class="eye right style-round" id="eyeR" aria-label="右目"></div>
              <div class="nose style-dot" id="nose" aria-label="鼻"></div>
              <div class="mouth style-smile" id="mouth" aria-label="口"></div>
            </div>
          </div>
          <div class="name-label" id="avatarNameLabel">ルミ</div>
          <div class="controls">
            <label for="avatarName">名前</label><input id="avatarName" value="ルミ" maxlength="12" />
            <label for="skinColor">肌色</label><input id="skinColor" type="color" value="#ffd6b6" />
            <label for="hairColor">髪色</label><input id="hairColor" type="color" value="#3a2a20" />
            <label for="faceType">輪郭</label>
            <select id="faceType"><option value="round">丸顔</option><option value="oval">面長</option><option value="square">四角顔</option></select>
            <label for="hairType">髪型</label>
            <select id="hairType"><option value="short">ショート</option><option value="bob">ボブ</option><option value="spiky">スパイキー</option></select>
            <label for="eyeType">目</label>
            <select id="eyeType"><option value="round">まる目</option><option value="almond">アーモンド</option><option value="line">切れ長</option></select>
            <label for="noseType">鼻</label>
            <select id="noseType"><option value="dot">点鼻</option><option value="line">ライン鼻</option><option value="triangle">三角鼻</option></select>
            <label for="mouthType">口</label>
            <select id="mouthType"><option value="smile">にっこり</option><option value="flat">フラット</option><option value="open">オープン</option></select>
            <label for="personality">性格</label>
            <select id="personality"><option value="cheerful">げんき</option><option value="calm">おだやか</option><option value="tsundere">ツンデレ</option><option value="wise">かしこい</option></select>
          </div>
        </div>
      </section>
      <section class="right">
        <div class="chat" id="chat"></div>
        <div class="input-area"><input id="playerInput" placeholder="話しかけてみよう！（例：冒険に行こう）" /><button id="sendBtn">話す</button></div>
      </section>
    </main>
  </div>

  <script>
    const state = { bond: 0, mood: "normal", avatarName: "ルミ", personality: "cheerful" };
    const chat = document.getElementById("chat");
    const bondEl = document.getElementById("bond");
    const moodEl = document.getElementById("mood");
    const faceEl = document.getElementById("face");

    const partSvgMap = {
      eyeType: { round: "assets/face/eye-round.svg", almond: "assets/face/eye-almond.svg", line: "assets/face/eye-line.svg" },
      noseType: { dot: "assets/face/nose-dot.svg", line: "assets/face/nose-line.svg", triangle: "assets/face/nose-triangle.svg" },
      mouthType: { smile: "assets/face/mouth-smile.svg", flat: "assets/face/mouth-flat.svg", open: "assets/face/mouth-open.svg" }
    };

    const styleMap = {
      faceType: { el: faceEl, prefix: "outline-" },
      hairType: { el: document.getElementById("hair"), prefix: "style-" },
      eyeType: { els: [document.getElementById("eyeL"), document.getElementById("eyeR")], prefix: "style-" },
      noseType: { el: document.getElementById("nose"), prefix: "style-" },
      mouthType: { el: document.getElementById("mouth"), prefix: "style-" }
    };

    function setPartStyle(key, value) {
      const cfg = styleMap[key];
      const clsPrefix = cfg.prefix;
      const apply = (el) => {
        [...el.classList].forEach(c => c.startsWith(clsPrefix) ? el.classList.remove(c) : null);
        el.classList.add(`${clsPrefix}${value}`);
      };
      cfg.els ? cfg.els.forEach(apply) : apply(cfg.el);

      if (partSvgMap[key]) {
        const src = partSvgMap[key][value];
        if (cfg.els) cfg.els.forEach((el) => { el.style.backgroundImage = `url(${src})`; });
        else cfg.el.style.backgroundImage = `url(${src})`;
      }
    }

    const storageKey = "avatarQuestCharacterV1";
    function saveCharacter() {
      const payload = {
        avatarName: state.avatarName,
        personality: document.getElementById("personality").value,
        skinColor: document.getElementById("skinColor").value,
        hairColor: document.getElementById("hairColor").value,
        faceType: document.getElementById("faceType").value,
        hairType: document.getElementById("hairType").value,
        eyeType: document.getElementById("eyeType").value,
        noseType: document.getElementById("noseType").value,
        mouthType: document.getElementById("mouthType").value
      };
      localStorage.setItem(storageKey, JSON.stringify(payload));
    }

    function loadCharacter() {
      const raw = localStorage.getItem(storageKey);
      if (!raw) return;
      try {
        const saved = JSON.parse(raw);
        const setIfExists = (id, value) => {
          if (!value) return;
          const el = document.getElementById(id);
          el.value = value;
        };
        setIfExists("avatarName", saved.avatarName);
        setIfExists("personality", saved.personality);
        setIfExists("skinColor", saved.skinColor);
        setIfExists("hairColor", saved.hairColor);
        ["faceType","hairType","eyeType","noseType","mouthType"].forEach((id) => setIfExists(id, saved[id]));
      } catch (_) {}
    }

    function addMessage(text, who) { const div = document.createElement("div"); div.className = `msg ${who}`; div.textContent = text; chat.appendChild(div); chat.scrollTop = chat.scrollHeight; }
    function setMood(next) { state.mood = next; moodEl.textContent = ({happy:"😄 ごきげん",normal:"🙂 ふつう",excited:"🤩 ワクワク",shy:"😳 てれ",serious:"🧐 しんけん"})[next] || "🙂 ふつう"; }

    function reactTo(text) {
      const name = state.avatarName;
      if (/ありがとう|助かった|好き|すごい/.test(text)) { state.bond += 3; setMood("happy"); return `えへへ、うれしい！ ${name}、もっとがんばれるよ！`; }
      if (/冒険|クエスト|旅|たたか/.test(text)) { state.bond += 2; setMood("excited"); return "いいね！ 次の目的地は「キラキラの丘」でどう？ 一緒に行こう！"; }
      if (/悩|つら|疲れ|しんど/.test(text)) { state.bond += 1; setMood("shy"); return `${name}がそばにいるよ。深呼吸して、ゆっくり進もう。`; }
      if (/作戦|勉強|計画|分析/.test(text)) { state.bond += 2; setMood("serious"); return "了解。目的・手順・準備の3つに分けて整理しよう。"; }
      const list = ({
        cheerful:[`やっほー！ ${name}は今日も元気100倍だよ！`,`それ、おもしろそう！ もっと聞かせて！`],
        calm:[`うん、落ち着いて考えてみよう。${name}は味方だよ。`,`いい感じだね。ゆっくりでも前に進んでるよ。`],
        tsundere:["べ、別に心配してるわけじゃないけど…話は聞くよ。","ふーん、悪くないんじゃない？ 続けてみなさいよ。"],
        wise:["興味深いね。原因と結果を分けると見通しがよくなるよ。","視点を1つ増やそう。「今できる最小の一歩」は何かな？"]
      })[state.personality] || [];
      state.bond += 1; setMood("normal"); return list[Math.floor(Math.random() * list.length)] || "うん、聞いてるよ！";
    }

    function talk() {
      const input = document.getElementById("playerInput");
      const text = input.value.trim(); if (!text) return;
      addMessage(text, "player"); input.value = "";
      faceEl.classList.add("talk"); setTimeout(() => faceEl.classList.remove("talk"), 300);
      setTimeout(() => { addMessage(reactTo(text), "avatar"); bondEl.textContent = state.bond; }, 260);
    }

    document.getElementById("sendBtn").addEventListener("click", talk);
    document.getElementById("playerInput").addEventListener("keydown", (e) => e.key === "Enter" && talk());
    document.getElementById("avatarName").addEventListener("input", (e) => { const v = e.target.value.trim() || "ルミ"; state.avatarName = v; document.getElementById("avatarNameLabel").textContent = v; saveCharacter(); });
    document.getElementById("skinColor").addEventListener("input", (e) => {
      document.getElementById("head").style.background = e.target.value;
      document.getElementById("earL").style.background = e.target.value;
      document.getElementById("earR").style.background = e.target.value;
      saveCharacter();
    });
    document.getElementById("hairColor").addEventListener("input", (e) => { document.getElementById("hair").style.background = e.target.value; saveCharacter(); });
    document.getElementById("personality").addEventListener("change", (e) => { state.personality = e.target.value; saveCharacter(); });
    ["faceType","hairType","eyeType","noseType","mouthType"].forEach(id => document.getElementById(id).addEventListener("change", (e) => { setPartStyle(id, e.target.value); saveCharacter(); }));

    loadCharacter();
    document.getElementById("avatarName").dispatchEvent(new Event("input"));
    document.getElementById("skinColor").dispatchEvent(new Event("input"));
    document.getElementById("hairColor").dispatchEvent(new Event("input"));
    document.getElementById("personality").dispatchEvent(new Event("change"));
    ["faceType","hairType","eyeType","noseType","mouthType"].forEach((id) => {
      const el = document.getElementById(id);
      setPartStyle(id, el.value);
    });

    addMessage("こんにちは！ わたしはルミ。パーツを選んで人型アバターを作ってね！", "avatar");
  </script>
</body>
</html>
