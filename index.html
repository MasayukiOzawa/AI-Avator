<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>アバタートーククエスト</title>
  <style>
    :root {
      --bg: #0f1221;
      --panel: #1a1f37;
      --panel2: #232947;
      --accent: #88e3ff;
      --accent2: #ff9ad5;
      --text: #f3f5ff;
      --muted: #bcc3e6;
      --ok: #80ffb9;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      background: radial-gradient(circle at top, #1b2140, var(--bg) 45%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .game {
      width: min(100%, 980px);
      background: linear-gradient(160deg, var(--panel), var(--panel2));
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,.35);
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.1);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: rgba(0,0,0,.2);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: .05em;
    }

    .status {
      display: flex;
      gap: 12px;
      color: var(--muted);
      font-size: .95rem;
    }

    main {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
    }

    .left {
      padding: 18px;
      border-right: 1px solid rgba(255,255,255,.08);
    }

    .section-title {
      margin: 0 0 10px;
      font-size: .95rem;
      color: var(--muted);
    }

    .avatar-card {
      background: rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .face {
      width: 160px;
      height: 160px;
      margin: 0 auto 14px;
      border-radius: 50%;
      position: relative;
      overflow: hidden;
      border: 4px solid rgba(255,255,255,.2);
      transition: transform .2s ease;
    }
    .face.talk { transform: scale(1.02); }

    .hair {
      position: absolute;
      top: -16px;
      left: -4px;
      width: 168px;
      height: 82px;
      border-bottom-left-radius: 70px;
      border-bottom-right-radius: 70px;
      border-top-left-radius: 80px;
      border-top-right-radius: 80px;
    }

    .eye { position: absolute; width: 22px; height: 22px; background: #222; border-radius: 50%; top: 72px; }
    .eye.left { left: 48px; }
    .eye.right { right: 48px; }

    .mouth {
      position: absolute;
      bottom: 40px;
      left: 50%;
      width: 42px;
      height: 12px;
      border-radius: 0 0 20px 20px;
      transform: translateX(-50%);
      border: 3px solid #333;
      border-top: none;
      transition: all .15s ease;
    }

    .face.talk .mouth {
      height: 18px;
      width: 34px;
      border-radius: 0 0 12px 12px;
    }

    .name-label {
      text-align: center;
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 1.1rem;
    }

    .controls label {
      display: block;
      font-size: .88rem;
      color: var(--muted);
      margin: 8px 0 4px;
    }

    .controls input, .controls select {
      width: 100%;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 10px;
    }

    .right {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 560px;
    }

    .chat {
      padding: 18px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 78%;
      padding: 10px 12px;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.player {
      align-self: flex-end;
      background: #3d6cff;
    }

    .msg.avatar {
      align-self: flex-start;
      background: rgba(255,255,255,.11);
      border: 1px solid rgba(255,255,255,.12);
    }

    .input-area {
      padding: 14px;
      border-top: 1px solid rgba(255,255,255,.08);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      background: rgba(0,0,0,.14);
    }

    .input-area input {
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: var(--text);
      padding: 11px 12px;
      font-size: 1rem;
    }

    button {
      border: none;
      border-radius: 12px;
      background: linear-gradient(120deg, var(--accent), var(--accent2));
      color: #17203d;
      padding: 10px 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .hint {
      font-size: .8rem;
      color: var(--muted);
      margin-top: 8px;
    }

    @media (max-width: 860px) {
      main { grid-template-columns: 1fr; }
      .left { border-right: none; border-bottom: 1px solid rgba(255,255,255,.08); }
      .right { min-height: 420px; }
    }
  </style>
</head>
<body>
  <div class="game">
    <header>
      <h1>🧭 アバタートーククエスト</h1>
      <div class="status">
        <span>親密度: <strong id="bond">0</strong></span>
        <span>ムード: <strong id="mood">🙂 ふつう</strong></span>
      </div>
    </header>
    <main>
      <section class="left">
        <p class="section-title">アバター作成</p>
        <div class="avatar-card">
          <div class="face" id="face" style="background:#ffd6b6;">
            <div class="hair" id="hair" style="background:#3a2a20;"></div>
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
          </div>
          <div class="name-label" id="avatarNameLabel">ルミ</div>
          <div class="controls">
            <label for="avatarName">名前</label>
            <input id="avatarName" value="ルミ" maxlength="12" />
            <label for="skinColor">肌色</label>
            <input id="skinColor" type="color" value="#ffd6b6" />
            <label for="hairColor">髪色</label>
            <input id="hairColor" type="color" value="#3a2a20" />
            <label for="personality">性格</label>
            <select id="personality">
              <option value="cheerful">げんき</option>
              <option value="calm">おだやか</option>
              <option value="tsundere">ツンデレ</option>
              <option value="wise">かしこい</option>
            </select>
          </div>
        </div>
      </section>

      <section class="right">
        <div class="chat" id="chat"></div>
        <div class="input-area">
          <input id="playerInput" placeholder="話しかけてみよう！（例：冒険に行こう）" />
          <button id="sendBtn">話す</button>
        </div>
      </section>
    </main>
  </div>

  <script>
    const state = {
      bond: 0,
      mood: "normal",
      avatarName: "ルミ",
      personality: "cheerful"
    };

    const chat = document.getElementById("chat");
    const bondEl = document.getElementById("bond");
    const moodEl = document.getElementById("mood");
    const faceEl = document.getElementById("face");

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = `msg ${who}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    function setMood(next) {
      state.mood = next;
      const map = {
        happy: "😄 ごきげん",
        normal: "🙂 ふつう",
        excited: "🤩 ワクワク",
        shy: "😳 てれ",
        serious: "🧐 しんけん"
      };
      moodEl.textContent = map[next] || map.normal;
    }

    function reactTo(text) {
      const t = text.toLowerCase();
      const name = state.avatarName;

      if (/ありがとう|助かった|好き|すごい/.test(text)) {
        state.bond += 3;
        setMood("happy");
        return `えへへ、うれしい！ ${name}、もっとがんばれるよ！`;
      }
      if (/冒険|クエスト|旅|たたか/.test(text)) {
        state.bond += 2;
        setMood("excited");
        return `いいね！ 次の目的地は「キラキラの丘」でどう？ 一緒に行こう！`;
      }
      if (/悩|つら|疲れ|しんど/.test(text)) {
        state.bond += 1;
        setMood("shy");
        return `${name}がそばにいるよ。深呼吸して、ゆっくり進もう。`;
      }
      if (/作戦|勉強|計画|分析/.test(text)) {
        state.bond += 2;
        setMood("serious");
        return `了解。目的・手順・準備の3つに分けて整理しよう。`;
      }

      const byPersonality = {
        cheerful: [
          `やっほー！ ${name}は今日も元気100倍だよ！`,
          `それ、おもしろそう！ もっと聞かせて！`
        ],
        calm: [
          `うん、落ち着いて考えてみよう。${name}は味方だよ。`,
          `いい感じだね。ゆっくりでも前に進んでるよ。`
        ],
        tsundere: [
          `べ、別に心配してるわけじゃないけど…話は聞くよ。`,
          `ふーん、悪くないんじゃない？ 続けてみなさいよ。`
        ],
        wise: [
          `興味深いね。原因と結果を分けると見通しがよくなるよ。`,
          `視点を1つ増やそう。「今できる最小の一歩」は何かな？`
        ]
      };

      const list = byPersonality[state.personality] || byPersonality.cheerful;
      state.bond += 1;
      setMood("normal");
      return list[Math.floor(Math.random() * list.length)];
    }

    function talk() {
      const input = document.getElementById("playerInput");
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, "player");
      input.value = "";

      faceEl.classList.add("talk");
      setTimeout(() => faceEl.classList.remove("talk"), 300);

      const reply = reactTo(text);
      setTimeout(() => {
        addMessage(reply, "avatar");
        bondEl.textContent = state.bond;
      }, 260);
    }

    document.getElementById("sendBtn").addEventListener("click", talk);
    document.getElementById("playerInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") talk();
    });

    document.getElementById("avatarName").addEventListener("input", (e) => {
      const v = e.target.value.trim() || "ルミ";
      state.avatarName = v;
      document.getElementById("avatarNameLabel").textContent = v;
    });

    document.getElementById("skinColor").addEventListener("input", (e) => {
      faceEl.style.background = e.target.value;
    });

    document.getElementById("hairColor").addEventListener("input", (e) => {
      document.getElementById("hair").style.background = e.target.value;
    });

    document.getElementById("personality").addEventListener("change", (e) => {
      state.personality = e.target.value;
    });

    addMessage("こんにちは！ わたしはルミ。いっしょに会話して親密度を上げよう！", "avatar");
  </script>
</body>
</html>
